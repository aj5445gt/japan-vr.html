<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>日本右駕模擬器 - Canvas Pseudo 3D</title>
<style>
  body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #87CEEB; overflow: hidden; font-family: sans-serif; }
  
  /* 遊戲畫面容器 */
  #gameContainer { position: relative; width: 100%; height: 100%; max-width: 800px; margin: 0 auto; background: #87CEEB; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
  canvas { display: block; width: 100%; height: 100%; }

  /* UI 儀表板 (純 CSS 繪製，無須加載圖片) */
  #dashboard { position: absolute; bottom: 0; left: 0; width: 100%; height: 35%; background: linear-gradient(to bottom, #2b2b2b, #111); border-top: 5px solid #444; border-radius: 20px 20px 0 0; }
  
  /* 右駕方向盤 */
  #steering-wheel { position: absolute; right: 10%; bottom: -10%; width: 220px; height: 220px; border: 25px solid #1a1a1a; border-radius: 50%; box-shadow: inset 0 0 10px #000, 0 5px 15px rgba(0,0,0,0.8); z-index: 10; display: flex; justify-content: center; align-items: center; }
  #steering-center { width: 60px; height: 60px; background: #333; border-radius: 50%; border: 2px solid #555; }
  #steering-spoke { position: absolute; width: 100%; height: 40px; background: #1a1a1a; top: 50%; transform: translateY(-50%); z-index: -1; }
  
  /* 左側排檔區 */
  #center-console { position: absolute; left: 15%; bottom: 0; width: 120px; height: 80%; background: #222; border-radius: 20px 20px 0 0; border: 2px solid #333; }
  #gear-stick { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); width: 15px; height: 60px; background: #777; border-radius: 10px; cursor: pointer; }
  #gear-knob { position: absolute; top: -20px; left: -12.5px; width: 40px; height: 40px; background: radial-gradient(circle, #555, #111); border-radius: 50%; }

  /* 撥桿 (肌肉記憶核心訓練點) */
  .stalk { position: absolute; top: 20px; width: 80px; height: 15px; background: #333; border-radius: 10px; cursor: pointer; z-index: 5; border: 1px solid #555; }
  #stalk-left { right: 200px; transform: rotate(-15deg); }
  #stalk-right { right: -40px; transform: rotate(15deg); }
  .stalk::after { content: ''; position: absolute; top: -5px; width: 25px; height: 25px; background: #555; border-radius: 50%; }
  #stalk-left::after { left: -10px; }
  #stalk-right::after { right: -10px; }

  /* 提示標籤 */
  .label { position: absolute; color: #aaa; font-size: 12px; font-weight: bold; pointer-events: none; text-shadow: 1px 1px 2px #000; }
  #label-wiper { right: 230px; top: 0px; color: #ff6b6b; }
  #label-signal { right: -60px; top: 0px; color: #4ecdc4; }
  #label-gear { left: 50%; transform: translateX(-50%); top: 80px; }

  /* 遊戲狀態提示 */
  #hud { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 18px; font-weight: bold; text-align: center; border: 2px solid #4ecdc4; display: none; }
  
  /* 任務目標 */
  #mission { position: absolute; top: 20px; left: 20px; background: rgba(20, 30, 50, 0.9); color: #fff; padding: 15px; border-left: 5px solid #f2c14e; border-radius: 5px; font-size: 14px; }
</style>
</head>
<body>

<div id="gameContainer">
  <!-- 渲染畫布 -->
  <canvas id="roadCanvas" width="800" height="600"></canvas>
  
  <!-- 任務面板 -->
  <div id="mission">
    <div style="color:#f2c14e; font-weight:bold; margin-bottom:5px;">任務 01: 直行與右轉預備</div>
    <div>保持在左側車道。準備右轉前，<br>請點擊右側撥桿打方向燈。</div>
  </div>

  <!-- 中央提示文字 -->
  <div id="hud">右方向燈作動中 ⇨</div>

  <!-- 車艙 UI -->
  <div id="dashboard">
    <!-- 中央鞍座 (左手排檔) -->
    <div id="center-console">
      <div id="gear-stick"><div id="gear-knob"></div></div>
      <div class="label" id="label-gear">排檔桿(左手)</div>
    </div>
    
    <!-- 右駕方向盤總成 -->
    <div style="position: absolute; right: 10%; bottom: 10%; width: 220px; height: 220px;">
      <div class="label" id="label-wiper">左:雨刷 (勿按)</div>
      <div class="stalk" id="stalk-left" onclick="toggleWiper()"></div>
      
      <div id="steering-wheel">
        <div id="steering-spoke"></div>
        <div id="steering-center"></div>
      </div>
      
      <div class="label" id="label-signal">右:方向燈 (點擊)</div>
      <div class="stalk" id="stalk-right" onclick="toggleSignal()"></div>
    </div>
  </div>
</div>

<script>
  // ==========================================
  // Pseudo-3D 道路渲染引擎 (Canvas Vector)
  // ==========================================
  const canvas = document.getElementById('roadCanvas');
  const ctx = canvas.getContext('2d');
  
  let width = canvas.width;
  let height = canvas.height;
  
  // 攝影機與道路設定
  let cameraDepth = 0.84; // 視角深度
  let segmentLength = 200; // 每一段道路的長度
  let roadWidth = 2000;    // 道路寬度
  let segments = [];
  let trackLength = 10000; 
  
  // 玩家狀態
  let position = 0; // 往前開的 Z 軸進度
  let speed = 60;   // 速度
  let playerX = -0.5; // X 軸位置 ( -0.5 代表在左線道正中央，這對日本右駕極為重要 )

  // 初始化道路段落
  for (let n = 0; n < trackLength; n++) {
    segments.push({
      z: n * segmentLength,
      color: Math.floor(n / 3) % 2 ? 
             { road: '#444', grass: '#2a8a3a', rumble: '#fff' } : 
             { road: '#444', grass: '#237330', rumble: '#e62222' }
    });
  }

  // 繪製多邊形 (梯形)
  function drawPolygon(ctx, x1, y1, x2, y2, x3, y3, x4, y4, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.lineTo(x4, y4);
    ctx.closePath();
    ctx.fill();
  }

  // 渲染迴圈
  function render() {
    ctx.clearRect(0, 0, width, height);
    
    let baseSegment = segments[Math.floor(position / segmentLength)];
    let maxy = height;
    
    // 從底端畫到地平線
    for (let n = 0; n < 300; n++) {
      let segment = segments[(Math.floor(position / segmentLength) + n) % segments.length];
      
      // 將 3D 座標投影到 2D 螢幕
      let p1 = { z: segment.z - position };
      let p2 = { z: segment.z + segmentLength - position };
      
      // 透視比例
      let scale1 = cameraDepth / (p1.z || 0.1);
      let scale2 = cameraDepth / (p2.z || 0.1);
      
      // X 與 Y 座標投影 (加入 playerX 以維持靠左行駛的視角)
      let x1 = width / 2 + (0 - playerX * roadWidth) * scale1 * width / 2;
      let y1 = height / 2 + 1000 * scale1 * height / 2;
      let w1 = roadWidth * scale1 * width / 2;

      let x2 = width / 2 + (0 - playerX * roadWidth) * scale2 * width / 2;
      let y2 = height / 2 + 1000 * scale2 * height / 2;
      let w2 = roadWidth * scale2 * width / 2;

      // 背面剔除
      if (y1 <= y2 || y1 < 0) continue;

      // 繪製草地
      ctx.fillStyle = segment.color.grass;
      ctx.fillRect(0, y2, width, y1 - y2);

      // 繪製路緣石
      drawPolygon(ctx, x1 - w1 * 1.1, y1, x1 + w1 * 1.1, y1, x2 + w2 * 1.1, y2, x2 - w2 * 1.1, y2, segment.color.rumble);

      // 繪製柏油路面
      drawPolygon(ctx, x1 - w1, y1, x1 + w1, y1, x2 + w2, y2, x2 - w2, y2, segment.color.road);
    }
    
    // 車輛前進
    position += speed;
    requestAnimationFrame(render);
  }
  
  render();

  // ==========================================
  // 肌肉記憶訓練邏輯 (UI 互動)
  // ==========================================
  const hud = document.getElementById('hud');
  let signalTimer = null;

  function toggleSignal() {
    hud.style.display = 'block';
    hud.innerHTML = '✅ 正確：右方向燈作動中 ⇨';
    hud.style.borderColor = '#4ecdc4';
    hud.style.color = '#4ecdc4';
    
    // 模擬撥桿動畫
    document.getElementById('stalk-right').style.transform = 'rotate(30deg)';
    setTimeout(() => { document.getElementById('stalk-right').style.transform = 'rotate(15deg)'; }, 200);

    clearTimeout(signalTimer);
    signalTimer = setTimeout(() => { hud.style.display = 'none'; }, 3000);
  }

  function toggleWiper() {
    hud.style.display = 'block';
    hud.innerHTML = '❌ 錯誤：誤觸雨刷！(台灣左駕習慣)';
    hud.style.borderColor = '#ff6b6b';
    hud.style.color = '#ff6b6b';
    
    document.getElementById('stalk-left').style.transform = 'rotate(-30deg)';
    setTimeout(() => { document.getElementById('stalk-left').style.transform = 'rotate(-15deg)'; }, 200);

    clearTimeout(signalTimer);
    signalTimer = setTimeout(() => { hud.style.display = 'none'; }, 3000);
  }
</script>
</body>
</html>
