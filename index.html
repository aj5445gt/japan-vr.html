<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日本右駕 3D 虛擬實境肌肉記憶模擬器</title>

  <!-- A-Frame CDN -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;
      background: #111827;
      color: #fff;
    }

    /* =========================================================
       頂部控制區
       ========================================================= */

    #top-ui {
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      padding: 10px;
      pointer-events: none;
    }

    #top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      max-width: 1400px;
      margin: auto;
    }

    #title-box {
      background: rgba(0, 0, 0, 0.78);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 12px;
      padding: 10px 15px;
      backdrop-filter: blur(8px);
      pointer-events: auto;
    }

    #title-box .title {
      font-size: 17px;
      font-weight: 800;
    }

    #title-box .subtitle {
      margin-top: 2px;
      font-size: 11px;
      color: #cbd5e1;
    }

    #score-panel {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.78);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 12px;
      padding: 8px 14px;
      pointer-events: auto;
    }

    .score-item {
      text-align: center;
      min-width: 60px;
    }

    .score-label {
      display: block;
      font-size: 10px;
      color: #94a3b8;
    }

    .score-value {
      display: block;
      font-size: 18px;
      font-weight: 800;
    }

    /* =========================================================
       Google AdSense 頂部廣告預留區
       ========================================================= */

    #top-ad {
      width: min(728px, 94vw);
      height: 60px;
      margin: 8px auto 0;
      background: #666;
      border-radius: 6px;
      color: #d1d5db;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      opacity: 0.85;
      pointer-events: auto;
    }

    /*
      GOOGLE ADSENSE 廣告版位預留區

      正式上線時可以將本區替換為 Google AdSense
      <ins class="adsbygoogle">...</ins>
      廣告程式碼。
    */

    /* =========================================================
       關卡控制面板
       ========================================================= */

    #mission-panel {
      position: fixed;
      z-index: 1000;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: min(620px, calc(100vw - 24px));
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      backdrop-filter: blur(10px);
    }

    #level-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    #level-number {
      font-size: 12px;
      font-weight: 800;
      color: #38bdf8;
    }

    #level-title {
      font-size: 16px;
      font-weight: 800;
    }

    #mission-text {
      color: #e2e8f0;
      font-size: 13px;
      line-height: 1.5;
    }

    #status-message {
      margin-top: 8px;
      min-height: 22px;
      font-size: 13px;
      font-weight: 700;
      color: #facc15;
    }

    #progress-container {
      margin-top: 9px;
      width: 100%;
      height: 7px;
      background: #334155;
      border-radius: 10px;
      overflow: hidden;
    }

    #progress-bar {
      height: 100%;
      width: 20%;
      background: #22c55e;
      transition: width 0.4s ease;
    }

    #control-buttons {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      background: #2563eb;
      color: white;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.12s ease;
    }

    button:hover {
      background: #3b82f6;
    }

    button:active {
      transform: scale(0.95);
    }

    button.secondary {
      background: #475569;
    }

    button.danger {
      background: #dc2626;
    }

    /* =========================================================
       操作提示
       ========================================================= */

    #view-hint {
      position: fixed;
      z-index: 900;
      top: 145px;
      left: 50%;
      transform: translateX(-50%);
      padding: 7px 12px;
      background: rgba(0,0,0,0.65);
      border-radius: 20px;
      color: #cbd5e1;
      font-size: 11px;
      pointer-events: none;
      white-space: nowrap;
    }

    /* =========================================================
       警告 Toast
       ========================================================= */

    #warning-toast {
      position: fixed;
      z-index: 2000;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      min-width: 280px;
      max-width: 90vw;
      padding: 20px;
      text-align: center;
      background: rgba(127, 29, 29, 0.96);
      border: 2px solid #ef4444;
      border-radius: 18px;
      box-shadow: 0 20px 70px rgba(0,0,0,0.7);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
    }

    #warning-toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    #warning-icon {
      font-size: 40px;
    }

    #warning-text {
      margin-top: 8px;
      font-size: 18px;
      font-weight: 900;
    }

    /* =========================================================
       證書 Modal
       ========================================================= */

    #certificate-modal {
      position: fixed;
      z-index: 3000;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: rgba(0,0,0,0.82);
    }

    #certificate-modal.show {
      display: flex;
    }

    #certificate {
      width: min(650px, 94vw);
      max-height: 92vh;
      overflow-y: auto;
      padding: 22px;
      background:
        linear-gradient(
          135deg,
          #f8fafc,
          #e2e8f0
        );
      color: #111827;
      border: 8px solid #94a3b8;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 30px 100px rgba(0,0,0,0.8);
    }

    #certificate h1 {
      margin: 5px 0;
      font-size: 28px;
    }

    #certificate h2 {
      margin: 5px 0 15px;
      color: #1d4ed8;
    }

    #certificate-score {
      font-size: 40px;
      font-weight: 900;
      margin: 15px 0;
    }

    #certificate-result {
      margin-bottom: 15px;
      font-size: 15px;
      line-height: 1.6;
    }

    /* =========================================================
       Google AdSense 證書彈窗廣告預留區
       ========================================================= */

    #certificate-ad {
      width: 100%;
      height: 90px;
      margin: 15px 0;
      background: #777;
      color: #d1d5db;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
    }

    /*
      GOOGLE ADSENSE 廣告版位預留區

      正式上線時可在此放置 Google AdSense
      <ins class="adsbygoogle">...</ins>
    */

    /* =========================================================
       手機版
       ========================================================= */

    @media (max-width: 700px) {

      #top-ui {
        padding: 6px;
      }

      #top-bar {
        align-items: flex-start;
      }

      #title-box {
        padding: 7px 9px;
      }

      #title-box .title {
        font-size: 13px;
      }

      #title-box .subtitle {
        font-size: 9px;
      }

      #score-panel {
        gap: 5px;
        padding: 6px 8px;
      }

      .score-item {
        min-width: 45px;
      }

      .score-value {
        font-size: 15px;
      }

      #top-ad {
        height: 45px;
      }

      #view-hint {
        top: 105px;
        font-size: 9px;
      }

      #mission-panel {
        bottom: 8px;
        padding: 11px;
        border-radius: 14px;
      }

      #level-title {
        font-size: 14px;
      }

      #mission-text {
        font-size: 12px;
      }

      #certificate {
        padding: 15px;
      }

      #certificate h1 {
        font-size: 23px;
      }
    }

    /* =========================================================
       3D 物件狀態
       ========================================================= */

    .clickable {
      cursor: pointer;
    }

    .interactive-highlight {
      animation: objectPulse 1.2s infinite;
    }

    @keyframes objectPulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.65;
      }
    }

    .danger-flash {
      animation: dangerFlash 0.25s 4;
    }

    @keyframes dangerFlash {
      0%, 100% {
        background: transparent;
      }
      50% {
        background: rgba(239,68,68,0.2);
      }
    }
  </style>
</head>

<body>

  <!-- =======================================================
       UI
       ======================================================== -->

  <div id="top-ui">

    <div id="top-bar">

      <div id="title-box">
        <div class="title">🇯🇵 日本右駕 3D 肌肉記憶模擬器</div>
        <div class="subtitle">日本左側通行・右駕駛座訓練</div>
      </div>

      <div id="score-panel">
        <div class="score-item">
          <span class="score-label">分數</span>
          <span class="score-value" id="score">0</span>
        </div>

        <div class="score-item">
          <span class="score-label">錯誤</span>
          <span class="score-value" id="mistakes">0</span>
        </div>

        <div class="score-item">
          <span class="score-label">關卡</span>
          <span class="score-value" id="level-display">1/5</span>
        </div>
      </div>

    </div>

    <!-- Google AdSense 頂部廣告佔位符 -->
    <div id="top-ad">
      Google AdSense 廣告版位
    </div>

  </div>


  <div id="view-hint">
    🖱️ 滑鼠拖曳／📱 手指滑動：360°觀察車內與道路
  </div>


  <!-- =======================================================
       A-FRAME 3D 場景
       ======================================================== -->

  <a-scene
    id="scene"
    embedded
    renderer="antialias: true; colorManagement: true"
    vr-mode-ui="enabled: true"
    device-orientation-permission-ui="enabled: true"
  >

    <!-- 光源 -->
    <a-entity light="type: ambient; intensity: 0.8"></a-entity>

    <a-entity
      light="type: directional; intensity: 1.1"
      position="5 10 5">
    </a-entity>

    <!-- =====================================================
         世界
         ====================================================== -->

    <a-sky color="#87CEEB"></a-sky>

    <!-- 地面 -->
    <a-plane
      rotation="-90 0 0"
      width="200"
      height="200"
      color="#557755">
    </a-plane>


    <!-- =====================================================
         日本道路
         左側通行
         ====================================================== -->

    <a-plane
      position="0 0.02 -35"
      rotation="-90 0 0"
      width="12"
      height="100"
      color="#333333">
    </a-plane>

    <!-- 左側道路線 -->
    <a-box
      position="-5 0.04 -35"
      width="0.12"
      height="0.02"
      depth="100"
      color="#ffffff">
    </a-box>

    <!-- 右側道路線 -->
    <a-box
      position="5 0.04 -35"
      width="0.12"
      height="0.02"
      depth="100"
      color="#ffffff">
    </a-box>

    <!-- 中央分隔線 -->
    <a-box
      position="0 0.045 -35"
      width="0.08"
      height="0.02"
      depth="100"
      color="#facc15">
    </a-box>


    <!-- =====================================================
         道路移動動畫
         ====================================================== -->

    <a-entity id="road-markings">

      <a-box
        position="0 0.06 -10"
        width="0.12"
        height="0.02"
        depth="4"
        color="#ffffff"
        animation="property: position; to: 0 0.06 -90; dur: 5000; loop: true; easing: linear">
      </a-box>

      <a-box
        position="0 0.06 -30"
        width="0.12"
        height="0.02"
        depth="4"
        color="#ffffff"
        animation="property: position; to: 0 0.06 -110; dur: 5000; loop: true; easing: linear">
      </a-box>

      <a-box
        position="0 0.06 -50"
        width="0.12"
        height="0.02"
        depth="4"
        color="#ffffff"
        animation="property: position; to: 0 0.06 -130; dur: 5000; loop: true; easing: linear">
      </a-box>

    </a-entity>


    <!-- =====================================================
         路邊建築
         ====================================================== -->

    <a-box
      position="-10 3 -30"
      width="8"
      height="6"
      depth="8"
      color="#d6c5a8">
    </a-box>

    <a-box
      position="10 3 -42"
      width="8"
      height="6"
      depth="8"
      color="#b8c6d1">
    </a-box>

    <a-box
      position="-10 2.5 -58"
      width="7"
      height="5"
      depth="7"
      color="#c7b198">
    </a-box>


    <!-- =====================================================
         止まれ標誌
         ====================================================== -->

    <a-entity
      id="stop-sign"
      position="3 2 -28">

      <!-- 支柱 -->
      <a-cylinder
        position="0 0 -0.05"
        radius="0.06"
        height="2.5"
        color="#777777">
      </a-cylinder>

      <!-- 八角形近似 -->
      <a-cylinder
        position="0 1.5 0"
        radius="0.75"
        height="0.08"
        color="#d71920"
        rotation="90 0 0"
        segments="8">
      </a-cylinder>

      <a-text
        value="止まれ"
        position="0 1.5 0.08"
        rotation="0 0 0"
        align="center"
        width="3"
        color="white">
      </a-text>

    </a-entity>


    <!-- =====================================================
         十字路口
         ====================================================== -->

    <a-plane
      id="intersection"
      position="0 0.025 -55"
      rotation="-90 0 0"
      width="32"
      height="16"
      color="#333333">
    </a-plane>

    <!-- 左轉道路 -->
    <a-plane
      position="-15 0.03 -55"
      rotation="-90 0 0"
      width="18"
      height="8"
      color="#333333">
    </a-plane>

    <!-- 右轉道路 -->
    <a-plane
      position="15 0.03 -55"
      rotation="-90 0 0"
      width="18"
      height="8"
      color="#333333">
    </a-plane>


    <!-- =====================================================
         車艙
         ====================================================== -->

    <a-entity id="cockpit">

      <!-- 儀表板 -->
      <a-box
        position="0 1.15 0"
        width="5.8"
        height="1.1"
        depth="0.7"
        color="#20252b">
      </a-box>

      <!-- 儀表板上緣 -->
      <a-box
        position="0 1.65 0"
        width="5.9"
        height="0.12"
        depth="0.75"
        color="#111827">
      </a-box>


      <!-- =================================================
           右側方向盤
           ================================================== -->

      <a-torus
        id="steering-wheel"
        class="clickable"
        position="1.75 1.45 -0.55"
        rotation="0 0 0"
        radius="0.55"
        radius-tubular="0.09"
        color="#111111"
        event-set__mouseenter="scale: 1.08 1.08 1.08"
        event-set__mouseleave="scale: 1 1 1">
      </a-torus>

      <!-- 方向盤中心 -->
      <a-cylinder
        position="1.75 1.45 -0.55"
        rotation="90 0 0"
        radius="0.18"
        height="0.12"
        color="#222222">
      </a-cylinder>

      <!-- 方向盤標籤 -->
      <a-text
        value="方向盤\n右駕"
        position="1.75 0.65 -0.65"
        align="center"
        width="2"
        color="#ffffff">
      </a-text>


      <!-- =================================================
           左側排檔桿
           ================================================== -->

      <a-entity
        id="gear-shift"
        class="clickable"
        position="-1.3 1.15 -0.55">

        <a-cylinder
          position="0 0.55 0"
          radius="0.07"
          height="1.1"
          color="#555555">
        </a-cylinder>

        <a-sphere
          position="0 1.1 0"
          radius="0.18"
          color="#111111">
        </a-sphere>

      </a-entity>

      <a-text
        value="排檔桿\n左手操作"
        position="-1.3 0.65 -0.7"
        align="center"
        width="2"
        color="#ffffff">
      </a-text>


      <!-- =================================================
           左側撥桿：雨刷
           ================================================== -->

      <a-entity
        id="left-stalk"
        class="clickable"
        position="-2.45 1.35 -0.5"
        rotation="0 0 -25">

        <a-cylinder
          radius="0.06"
          height="0.8"
          color="#444444">
        </a-cylinder>

        <a-sphere
          position="0 0.4 0"
          radius="0.12"
          color="#222222">
        </a-sphere>

      </a-entity>

      <a-text
        value="左撥桿\n雨刷"
        position="-2.45 0.65 -0.7"
        align="center"
        width="1.7"
        color="#f87171">
      </a-text>


      <!-- =================================================
           右側撥桿：方向燈
           ================================================== -->

      <a-entity
        id="right-stalk"
        class="clickable"
        position="2.45 1.35 -0.5"
        rotation="0 0 25">

        <a-cylinder
          radius="0.06"
          height="0.8"
          color="#444444">
        </a-cylinder>

        <a-sphere
          position="0 0.4 0"
          radius="0.12"
          color="#22c55e">
        </a-sphere>

      </a-entity>

      <a-text
        value="右撥桿\n方向燈"
        position="2.45 0.65 -0.7"
        align="center"
        width="1.7"
        color="#4ade80">
      </a-text>


      <!-- =================================================
           煞車踏板
           ================================================== -->

      <a-box
        id="brake-pedal"
        class="clickable"
        position="0.5 0.3 -0.8"
        width="0.35"
        height="0.65"
        depth="0.15"
        rotation="10 0 0"
        color="#444444">
      </a-box>

      <a-text
        value="煞車"
        position="0.5 0.75 -0.85"
        align="center"
        width="1.3"
        color="#f87171">
      </a-text>


      <!-- =================================================
           引擎啟動按鈕
           ================================================== -->

      <a-cylinder
        id="engine-button"
        class="clickable"
        position="2.4 1.25 -0.6"
        rotation="90 0 0"
        radius="0.18"
        height="0.12"
        color="#dc2626">
      </a-cylinder>

      <a-text
        value="ENGINE"
        position="2.4 0.95 -0.7"
        align="center"
        width="1.5"
        color="#fca5a5">
      </a-text>

    </a-entity>


    <!-- =====================================================
         駕駛人視角
         ====================================================== -->

    <a-entity
      id="camera-rig"
      position="0 1.65 3">

      <a-camera
        id="main-camera"
        look-controls="enabled: true; reverseMouseDrag: false"
        wasd-controls="enabled: false"
        fov="75">
      </a-camera>

    </a-entity>

  </a-scene>


  <!-- =======================================================
       關卡控制面板
       ======================================================== -->

  <div id="mission-panel">

    <div id="level-header">
      <div>
        <div id="level-number">LEVEL 1</div>
        <div id="level-title">右駕起步</div>
      </div>
    </div>

    <div id="mission-text">
      請點擊方向盤右側的 ENGINE 啟動引擎，再用左手操作左側排檔桿。
    </div>

    <div id="status-message">
      等待你的操作……
    </div>

    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>

    <div id="control-buttons">
      <button
        id="restart-button"
        class="secondary">
        重新開始
      </button>

      <button
        id="next-button"
        style="display:none;">
        下一關
      </button>
    </div>

  </div>


  <!-- =======================================================
       警告
       ======================================================== -->

  <div id="warning-toast">

    <div id="warning-icon">⚠️</div>

    <div id="warning-text">
      操作錯誤
    </div>

  </div>


  <!-- =======================================================
       證書
       ======================================================== -->

  <div id="certificate-modal">

    <div id="certificate">

      <div style="font-size:45px;">🏆</div>

      <h1>日本右駕肌肉記憶訓練</h1>

      <h2>訓練完成證明</h2>

      <div id="certificate-score">
        0 分
      </div>

      <div id="certificate-result">
        恭喜完成全部五個日本右駕情境訓練。
      </div>

      <!-- Google AdSense 證書彈窗廣告佔位符 -->
      <div id="certificate-ad">
        Google AdSense 廣告版位
      </div>

      <button id="certificate-restart">
        再訓練一次
      </button>

    </div>

  </div>


  <script>

    /* =========================================================
       日本右駕 3D 肌肉記憶模擬器
       ========================================================= */

    const state = {

      level: 1,

      score: 0,

      mistakes: 0,

      engineStarted: false,

      gearSelected: false,

      rightSignal: false,

      brakePressed: false,

      lookLeft: false,

      lookRight: false,

      intersectionChoice: null,

      completed: false

    };


    const levels = [

      {
        title: "右駕起步",
        text:
          "請點擊方向盤右側的 ENGINE 啟動引擎，再用左手操作左側排檔桿。"
      },

      {
        title: "前方右轉：方向燈",
        text:
          "前方即將右轉，請使用右側撥桿打方向燈。注意：左側撥桿是雨刷。"
      },

      {
        title: "止まれ：停車觀察",
        text:
          "前方出現「止まれ」。請踩煞車，並左右搖擺視角觀察兩側路況。"
      },

      {
        title: "十字路口：右轉",
        text:
          "進入十字路口後準備右轉。日本左側通行，右轉時要選擇正確的靠左轉彎路線。"
      },

      {
        title: "綜合肌肉記憶",
        text:
          "最後挑戰：依序完成發動、排檔、右方向燈、煞車、左右觀察與正確右轉。"
      }

    ];


    const scoreEl =
      document.getElementById("score");

    const mistakesEl =
      document.getElementById("mistakes");

    const levelDisplayEl =
      document.getElementById("level-display");

    const levelNumberEl =
      document.getElementById("level-number");

    const levelTitleEl =
      document.getElementById("level-title");

    const missionTextEl =
      document.getElementById("mission-text");

    const statusEl =
      document.getElementById("status-message");

    const progressEl =
      document.getElementById("progress-bar");

    const warningToast =
      document.getElementById("warning-toast");

    const warningText =
      document.getElementById("warning-text");

    const certificateModal =
      document.getElementById("certificate-modal");


    /* =========================================================
       UI 更新
       ========================================================= */

    function updateUI() {

      scoreEl.textContent =
        state.score;

      mistakesEl.textContent =
        state.mistakes;

      levelDisplayEl.textContent =
        state.level + "/5";

      levelNumberEl.textContent =
        "LEVEL " + state.level;

      levelTitleEl.textContent =
        levels[state.level - 1].title;

      missionTextEl.textContent =
        levels[state.level - 1].text;

      progressEl.style.width =
        ((state.level - 1) / 5 * 100 + 20) + "%";
    }


    function setStatus(text, color = "#facc15") {

      statusEl.textContent =
        text;

      statusEl.style.color =
        color;
    }


    function addScore(points) {

      state.score += points;

      updateUI();

    }


    function mistake(message) {

      state.mistakes++;

      state.score =
        Math.max(0, state.score - 10);

      updateUI();

      showWarning(message);

    }


    function showWarning(message) {

      warningText.textContent =
        message;

      warningToast.classList.add("show");

      document.body.classList.add("danger-flash");

      setTimeout(() => {

        warningToast.classList.remove("show");

        document.body.classList.remove("danger-flash");

      }, 1600);

    }


    /* =========================================================
       關卡控制
       ========================================================= */

    function completeLevel() {

      if (state.level >= 5) {

        finishGame();

        return;

      }

      addScore(100);

      setStatus(
        "✓ 關卡完成！準備進入下一個路況。",
        "#4ade80"
      );

      document.getElementById("next-button")
        .style.display = "block";

    }


    function nextLevel() {

      state.level++;

      resetLevelFlags();

      document.getElementById("next-button")
        .style.display = "none";

      clearHighlights();

      setupLevel();

      updateUI();

    }


    function resetLevelFlags() {

      state.engineStarted = false;
      state.gearSelected = false;
      state.rightSignal = false;
      state.brakePressed = false;
      state.lookLeft = false;
      state.lookRight = false;
      state.intersectionChoice = null;

    }


    function setupLevel() {

      setStatus(
        "等待你的操作……",
        "#facc15"
      );

      clearHighlights();

      if (state.level === 1) {

        highlight("engine-button");
        highlight("gear-shift");

      }

      if (state.level === 2) {

        highlight("right-stalk");

      }

      if (state.level === 3) {

        highlight("brake-pedal");

      }

      if (state.level === 4) {

        setStatus(
          "請選擇正確的右轉路線。",
          "#facc15"
        );

      }

      if (state.level === 5) {

        highlight("engine-button");

        setStatus(
          "綜合測驗開始。",
          "#38bdf8"
        );

      }

    }


    function highlight(id) {

      const el =
        document.getElementById(id);

      if (!el) return;

      el.classList.add(
        "interactive-highlight"
      );

    }


    function clearHighlights() {

      document
        .querySelectorAll(".interactive-highlight")
        .forEach(el => {

          el.classList.remove(
            "interactive-highlight"
          );

        });

    }


    /* =========================================================
       第一關
       ========================================================= */

    function handleEngine() {

      if (state.level !== 1 &&
          state.level !== 5) {

        mistake(
          "目前不是發動引擎階段。"
        );

        return;

      }

      if (!state.engineStarted) {

        state.engineStarted = true;

        addScore(20);

        setStatus(
          "✓ 引擎已啟動。請用左手操作左側排檔桿。",
          "#4ade80"
        );

        const engine =
          document.getElementById("engine-button");

        engine.setAttribute(
          "color",
          "#22c55e"
        );

        if (state.level === 1) {

          highlight("gear-shift");

        }

      }

      checkLevel1();

    }


    function handleGear() {

      if (state.level !== 1 &&
          state.level !== 5) {

        mistake(
          "目前不是排檔操作階段。"
        );

        return;

      }

      if (!state.engineStarted) {

        mistake(
          "請先發動引擎，再操作排檔桿。"
        );

        return;

      }

      state.gearSelected = true;

      addScore(20);

      setStatus(
        "✓ 左手排檔完成。",
        "#4ade80"
      );

      const gear =
        document.getElementById("gear-shift");

      gear.setAttribute(
        "animation",
        "property: rotation; to: -15 0 0; dur: 400"
      );

      checkLevel1();

    }


    function checkLevel1() {

      if (
        state.engineStarted &&
        state.gearSelected
      ) {

        completeLevel();

      }

    }


    /* =========================================================
       第二關
       ========================================================= */

    function handleRightStalk() {

      if (state.level !== 2 &&
          state.level !== 5) {

        mistake(
          "現在不需要操作右側方向燈。"
        );

        return;

      }

      state.rightSignal = true;

      addScore(25);

      setStatus(
        "✓ 右側方向燈已開啟，準備右轉。",
        "#4ade80"
      );

      const stalk =
        document.getElementById("right-stalk");

      stalk.setAttribute(
        "color",
        "#22c55e"
      );

      if (state.level === 2) {

        completeLevel();

      }

    }


    function handleLeftStalk() {

      if (state.level === 2) {

        mistake(
          "錯誤！左側撥桿是雨刷，不是方向燈。"
        );

        animateWipers();

      }

    }


    function animateWipers() {

      const wiper =
        document.getElementById("left-stalk");

      wiper.setAttribute(
        "animation",
        "property: rotation; from: 0 0 -25; to: 0 0 25; dur: 250; loop: 3"
      );

      setStatus(
        "⚠️ 雨刷被誤觸發！日本右駕車輛要記住撥桿位置。",
        "#f87171"
      );

    }


    /* =========================================================
       第三關
       ========================================================= */

    function handleBrake() {

      if (state.level !== 3 &&
          state.level !== 5) {

        mistake(
          "目前不需要踩煞車。"
        );

        return;

      }

      state.brakePressed = true;

      addScore(25);

      const brake =
        document.getElementById("brake-pedal");

      brake.setAttribute(
        "color",
        "#dc2626"
      );

      setStatus(
        "✓ 已踩煞車。現在請向左、向右觀察路況。",
        "#4ade80"
      );

      checkObservation();

    }


    function handleLook(direction) {

      if (state.level !== 3 &&
          state.level !== 5) {

        return;

      }

      if (direction === "left") {

        state.lookLeft = true;

        setStatus(
          "✓ 已觀察左側路況。",
          "#4ade80"
        );

      }

      if (direction === "right") {

        state.lookRight = true;

        setStatus(
          "✓ 已觀察右側路況。",
          "#4ade80"
        );

      }

      checkObservation();

    }


    function checkObservation() {

      if (
        state.brakePressed &&
        state.lookLeft &&
        state.lookRight
      ) {

        addScore(30);

        setStatus(
          "✓ 停車、左右觀察完成，可以安全前進。",
          "#4ade80"
        );

        if (state.level === 3) {

          setTimeout(
            completeLevel,
            600
          );

        }

      }

    }


    /* =========================================================
       第四關
       ========================================================= */

    function chooseTurn(type) {

      if (state.level !== 4 &&
          state.level !== 5) {

        return;

      }

      state.intersectionChoice =
        type;

      if (type === "correct") {

        addScore(40);

        setStatus(
          "✓ 正確！日本左側通行，右轉應採安全的大弧度路線。",
          "#4ade80"
        );

        if (state.level === 4) {

          completeLevel();

        }

      } else {

        mistake(
          "⚠️ 逆向警報！轉彎路線錯誤。"
        );

        setStatus(
          "逆向警報！請記住日本是左側通行。",
          "#f87171"
        );

      }

    }


    /* =========================================================
       第五關：綜合測驗
       ========================================================= */

    function finishGame() {

      state.completed = true;

      clearHighlights();

      const finalScore =
        Math.max(
          0,
          state.score
        );

      document.getElementById(
        "certificate-score"
      ).textContent =
        finalScore + " 分";

      document.getElementById(
        "certificate-result"
      ).innerHTML =
        `
          你已完成日本右駕五大核心情境。<br>
          錯誤次數：${state.mistakes} 次<br>
          ${getResultText(finalScore)}
        `;

      certificateModal.classList.add(
        "show"
      );

    }


    function getResultText(score) {

      if (score >= 350) {

        return "🏆 卓越：右駕肌肉記憶非常穩定。";

      }

      if (score >= 250) {

        return "🥇 優良：已建立良好的日本右駕操作習慣。";

      }

      if (score >= 150) {

        return "🥈 合格：建議再練習幾次熟悉撥桿與轉彎。";

      }

      return "📚 建議繼續練習，強化右駕操作肌肉記憶。";

    }


    /* =========================================================
       360° 視角觀察偵測
       ========================================================= */

    let lastCameraRotation = {
      x: 0,
      y: 0
    };

    let accumulatedRotation = 0;

    function monitorCamera() {

      const camera =
        document.getElementById(
          "main-camera"
        );

      if (!camera) return;

      const rotation =
        camera.getAttribute(
          "rotation"
        );

      if (!rotation) return;

      const delta =
        Math.abs(
          rotation.y -
          lastCameraRotation.y
        );

      accumulatedRotation += delta;

      if (rotation.y < -15) {

        handleLook("left");

      }

      if (rotation.y > 15) {

        handleLook("right");

      }

      lastCameraRotation.y =
        rotation.y;

    }


    setInterval(
      monitorCamera,
      250
    );


    /* =========================================================
       DOM 事件
       ========================================================= */

    document
      .getElementById("engine-button")
      .addEventListener(
        "click",
        handleEngine
      );


    document
      .getElementById("gear-shift")
      .addEventListener(
        "click",
        handleGear
      );


    document
      .getElementById("right-stalk")
      .addEventListener(
        "click",
        handleRightStalk
      );


    document
      .getElementById("left-stalk")
      .addEventListener(
        "click",
        handleLeftStalk
      );


    document
      .getElementById("brake-pedal")
      .addEventListener(
        "click",
        handleBrake
      );


    /* =========================================================
       駕駛視角互動：
       滑鼠／觸控由 A-Frame look-controls 處理
       ========================================================= */

    const camera =
      document.getElementById(
        "main-camera"
      );

    camera.addEventListener(
      "componentinitialized",
      function () {

        if (
          this.components &&
          this.components["look-controls"]
        ) {

          this.components[
            "look-controls"
          ].play();

        }

      }
    );


    /* =========================================================
       第四關：模擬左右轉向區域
       ========================================================= */

    const scene =
      document.getElementById(
        "scene"
      );


    const leftTurnZone =
      document.createElement(
        "a-box"
      );

    leftTurnZone.setAttribute(
      "position",
      "-5 0.15 -55"
    );

    leftTurnZone.setAttribute(
      "width",
      "7"
    );

    leftTurnZone.setAttribute(
      "height",
      "0.1"
    );

    leftTurnZone.setAttribute(
      "depth",
      "8"
    );

    leftTurnZone.setAttribute(
      "color",
      "#2563eb"
    );

    leftTurnZone.setAttribute(
      "opacity",
      "0.18"
    );

    leftTurnZone.classList.add(
      "clickable"
    );

    scene.appendChild(
      leftTurnZone
    );


    const rightTurnZone =
      document.createElement(
        "a-box"
      );

    rightTurnZone.setAttribute(
      "position",
      "5 0.15 -55"
    );

    rightTurnZone.setAttribute(
      "width",
      "7"
    );

    rightTurnZone.setAttribute(
      "height",
      "0.1"
    );

    rightTurnZone.setAttribute(
      "depth",
      "8"
    );

    rightTurnZone.setAttribute(
      "color",
      "#ef4444"
    );

    rightTurnZone.setAttribute(
      "opacity",
      "0.18"
    );

    rightTurnZone.classList.add(
      "clickable"
    );

    scene.appendChild(
      rightTurnZone
    );


    leftTurnZone.addEventListener(
      "click",
      function () {

        chooseTurn("correct");

      }
    );


    rightTurnZone.addEventListener(
      "click",
      function () {

        chooseTurn("wrong");

      }
    );


    /* =========================================================
       重新開始
       ========================================================= */

    function restartGame() {

      state.level = 1;

      state.score = 0;

      state.mistakes = 0;

      state.completed = false;

      resetLevelFlags();

      certificateModal.classList.remove(
        "show"
      );

      const engine =
        document.getElementById(
          "engine-button"
        );

      engine.setAttribute(
        "color",
        "#dc2626"
      );

      const brake =
        document.getElementById(
          "brake-pedal"
        );

      brake.setAttribute(
        "color",
        "#444444"
      );

      updateUI();

      setupLevel();

      setStatus(
        "新的訓練開始，請準備。"
      );

    }


    document
      .getElementById("restart-button")
      .addEventListener(
        "click",
        restartGame
      );


    document
      .getElementById("next-button")
      .addEventListener(
        "click",
        nextLevel
      );


    document
      .getElementById("certificate-restart")
      .addEventListener(
        "click",
        restartGame
      );


    /* =========================================================
       鍵盤輔助操作
       ========================================================= */

    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "ArrowLeft") {

          handleLook("left");

        }

        if (event.key === "ArrowRight") {

          handleLook("right");

        }

        if (event.key.toLowerCase() === "b") {

          handleBrake();

        }

      }
    );


    /* =========================================================
       A-Frame 載入完成
       ========================================================= */

    scene.addEventListener(
      "loaded",
      function() {

        updateUI();

        setupLevel();

        setStatus(
          "系統就緒。請開始你的日本右駕訓練。",
          "#38bdf8"
        );

      }
    );

  </script>

</body>
</html>
